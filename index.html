<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Einladung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital@0;1&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(ellipse at 50% 20%, #1b2620, #0f1712); }
  .stage { position: relative; min-height: 100vh; padding: 32px 16px 64px; overflow-x: hidden; overflow-y: visible; }
  .leaves-fall { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  .leaf-fall { position: absolute; top: -40px; opacity: 0; animation-name: fall; animation-timing-function: ease-in; animation-fill-mode: forwards; }
  @keyframes fall { 0% { transform: translateY(0) rotate(0deg); opacity: 0; } 8% { opacity: 0.9; } 100% { transform: translateY(115vh) rotate(340deg); opacity: 0.9; } }
  .envelope-wrap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 300px; height: 202px; cursor: pointer; text-align: center; transition: opacity 0.5s ease, transform 0.5s ease; z-index: 20; }
  .envelope-wrap.hidden { opacity: 0; transform: translate(-50%, -50%) scale(0.9); pointer-events: none; }
  .envelope { width: 250px; height: 168px; position: relative; margin: 0 auto 26px; filter: drop-shadow(0 22px 30px rgba(0,0,0,0.4)); }
  .env-body { position: absolute; inset: 0; background: linear-gradient(180deg, #faf5ea 0%, #ecdfc4 100%); border-radius: 3px; }
  .env-flap { position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 125px solid transparent; border-right: 125px solid transparent; border-top: 84px solid #ecdfc4; transform-origin: top; transition: transform 0.8s cubic-bezier(.5,0,.25,1) 0.1s; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15)); }
  .envelope-wrap.open .env-flap { transform: rotateX(-35deg) translateY(-2px); }
  .envelope-label { font-family: 'Fraunces', serif; font-style: italic; font-size: 1.4rem; color: #faf5ea; letter-spacing: 0.02em; }
  .hint { margin-top: 14px; font-size: 0.85rem; color: #a99a86; font-weight: 300; }
  .seal-holder { position: absolute; top: 84px; left: 50%; width: 76px; height: 76px; transform: translate(-50%, -50%); z-index: 30; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .seal-piece { position: absolute; inset: 0; transition: transform 0.6s cubic-bezier(.3,0,.2,1), opacity 0.6s ease; }
  .envelope-wrap.open .seal-piece.p1 { transform: translate(-32px, 16px) rotate(-38deg); opacity: 0; }
  .envelope-wrap.open .seal-piece.p2 { transform: translate(24px, 22px) rotate(30deg); opacity: 0; }
  .envelope-wrap.open .seal-piece.p3 { transform: translate(2px, -24px) rotate(12deg); opacity: 0; }
  .invitation-content { position: relative; z-index: 2; width: min(100%, 520px); margin: 0 auto; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 48px; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.5s ease; }
  .stage.invitation-shown .invitation-content { opacity: 1; visibility: visible; pointer-events: auto; }
  .card-image { position: relative; z-index: 2; max-width: 480px; width: min(100%, 480px); box-shadow: 0 30px 70px rgba(0,0,0,0.5); border-radius: 3px; display: block; opacity: 0; transform: translateY(24px) scale(0.97); transition: opacity 0.7s ease, transform 0.7s ease; pointer-events: none; }
  .card-image.visible { opacity: 1; transform: translateY(0) scale(1); }
  .packlist-button { margin-top: 24px; padding: 13px 25px; border: 1px solid rgba(250,245,234,0.5); border-radius: 999px; background: rgba(250,245,234,0.08); color: #faf5ea; font: inherit; font-family: 'Fraunces', serif; font-size: 1rem; cursor: pointer; transition: background 0.25s ease, transform 0.25s ease, border-color 0.25s ease; opacity: 0; transform: translateY(10px); pointer-events: none; }
  .packlist-button.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .packlist-button:hover { background: rgba(250,245,234,0.16); border-color: rgba(250,245,234,0.8); transform: translateY(-1px); }
  .packlist { width: 100%; margin-top: 24px; opacity: 0; transform: translateY(18px); transition: opacity 0.6s ease, transform 0.6s ease; pointer-events: none; display: none; }
  .packlist.visible { display: block; opacity: 1; transform: translateY(0); pointer-events: auto; }
  .packlist-title { margin: 0 0 14px; text-align: center; font-family: 'Fraunces', serif; font-size: 1.5rem; color: #faf5ea; font-weight: 400; }
  .packlist-frame { display: block; width: 100%; height: min(75vh, 800px); min-height: 500px; border: 0; border-radius: 3px; background: #fff; box-shadow: 0 30px 70px rgba(0,0,0,0.5); }
  @media (max-width: 600px) { .stage { width: 100%; box-sizing: border-box; } .envelope-wrap { width: 300px; height: 202px; } .invitation-content { width: 100%; max-width: 480px; box-sizing: border-box; padding-left: 12px; padding-right: 12px; } .card-image { width: 100%; max-width: 480px; height: auto; } }
</style>
</head>
<body>
<div class="stage">
  <div class="leaves-fall" id="leavesFall"></div>
  <div class="envelope-wrap" id="envelopeWrap">
    <div class="envelope"><div class="env-body"></div><div class="env-flap"></div><div class="seal-holder" id="sealHolder"></div></div>
    <div class="envelope-label">Für Papi</div><div class="hint">Zum Öffnen Siegel anklicken</div>
  </div>
  <div class="invitation-content">
    <img class="card-image" id="cardImage" src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/wAARCA==" alt="Einladung">
    <button class="packlist-button" id="packlistButton">Zur Packliste</button>
    <section class="packlist" id="packlist" aria-hidden="true"><h2 class="packlist-title">Packliste</h2><iframe class="packlist-frame" src="Einladung_Packliste.pdf" title="Packliste"></iframe></section>
  </div>
</div>
<script>
const NS="http://www.w3.org/2000/svg";const stage=document.querySelector('.stage');const envelopeWrap=document.getElementById('envelopeWrap');const cardImage=document.getElementById('cardImage');const packlistButton=document.getElementById('packlistButton');const packlist=document.getElementById('packlist');const leavesFall=document.getElementById('leavesFall');const sealHolder=document.getElementById('sealHolder');
function el(tag,attrs){const n=document.createElementNS(NS,tag);for(const k in attrs)n.setAttribute(k,attrs[k]);return n}
function buildSeal(){const svg=el('svg',{viewBox:'0 0 76 76',width:'76',height:'76',style:'position:absolute;inset:0;filter:drop-shadow(0 4px 5px rgba(0,0,0,0.35))'});const defs=el('defs',{});const grad=el('radialGradient',{id:'sealGrad',cx:'35%',cy:'30%',r:'75%'});[['0%','#a83828'],['45%','#7a1f16'],['80%','#5c150f'],['100%','#3d0d09']].forEach(x=>grad.appendChild(el('stop',{offset:x[0],'stop-color':x[1]})));defs.appendChild(grad);svg.appendChild(defs);const wobble='M38 4 C44 3 48 8 53 7 C59 8 61 14 66 17 C71 21 70 27 72 33 C74 39 69 43 68 49 C67 55 61 56 57 60 C53 64 48 62 42 65 C36 68 32 64 26 65 C20 66 17 61 12 58 C7 55 8 49 5 44 C2 39 6 34 6 28 C6 22 11 19 14 14 C17 9 23 11 28 7 C33 3 33 5 38 4 Z';function piece(id,d,cls){const c=el('clipPath',{id});c.appendChild(el('path',{d}));defs.appendChild(c);const g=el('g',{class:'seal-piece '+cls});const inner=el('g',{'clip-path':`url(#${id})`});inner.appendChild(el('path',{d:wobble,fill:'url(#sealGrad)'}));g.appendChild(inner);return g}svg.appendChild(piece('clipP1','M38 5 C50 5 57 11 63 19 L36 42 L9 48 C5 39 6 27 13 18 C19 10 27 5 38 5 Z','p1'));svg.appendChild(piece('clipP2','M63 19 C70 27 71 38 66 48 C61 58 50 66 38 66 L36 42 Z','p2'));svg.appendChild(piece('clipP3','M9 48 L36 42 L38 66 C26 66 14 59 9 48 Z','p3'));const emblem=el('g',{class:'seal-piece p1',opacity:'0.5'});emblem.appendChild(el('path',{d:'M38 22 C33 28 29 33 29 39 C29 46 33 51 38 55 C43 51 47 46 47 39 C47 33 43 28 38 22 Z',fill:'none',stroke:'#3d0d09','stroke-width':'1.3'}));emblem.appendChild(el('line',{x1:'38',y1:'26',x2:'38',y2:'52',stroke:'#3d0d09','stroke-width':'1'}));svg.appendChild(emblem);svg.appendChild(el('ellipse',{class:'seal-piece p1',cx:'30',cy:'20',rx:'10',ry:'6',fill:'#c85a3f',opacity:'0.35'}));sealHolder.appendChild(svg)}buildSeal();
const colors=['#a8502c','#c8952f','#7a3324','#9c7a2e','#2f6b4a'];function spawnLeaf(){const leaf=document.createElement('div');leaf.className='leaf-fall';const size=10+Math.random()*10;leaf.style.left=Math.random()*100+'%';leaf.style.width=size+'px';leaf.style.height=size+'px';leaf.style.background=colors[Math.floor(Math.random()*colors.length)];leaf.style.borderRadius='0% 60% 0% 60%';leaf.style.animationDuration=6+Math.random()*5+'s';leavesFall.appendChild(leaf);setTimeout(()=>leaf.remove(),12000)}let ambientInterval=null;function startAmbientLeaves(){for(let i=0;i<6;i++)setTimeout(spawnLeaf,i*300);ambientInterval=setInterval(spawnLeaf,900)}
envelopeWrap.addEventListener('click',()=>{if(envelopeWrap.classList.contains('open'))return;envelopeWrap.classList.add('open');for(let i=0;i<22;i++)setTimeout(spawnLeaf,i*60);setTimeout(()=>envelopeWrap.classList.add('hidden'),600);setTimeout(()=>{cardImage.classList.add('visible');stage.classList.add('invitation-shown');packlistButton.classList.add('visible');startAmbientLeaves()},750)});
packlistButton.addEventListener('click',()=>{const isVisible=packlist.classList.toggle('visible');packlist.setAttribute('aria-hidden',String(!isVisible));packlistButton.textContent=isVisible?'Packliste schließen':'Zur Packliste';if(isVisible)setTimeout(()=>packlist.scrollIntoView({behavior:'smooth',block:'start'}),80)});
</script></body></html>
